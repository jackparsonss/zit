name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          zig-version: 0.16.0

      - name: Run tests
        run: zig build test --summary all

      - name: Build in safe
        run: zig build -Doptimize=ReleaseSafe

      - name: Build in fast
        run: zig build -Doptimize=ReleaseFast
